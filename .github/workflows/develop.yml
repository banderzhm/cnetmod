name: Develop feature completeness

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-small-platform:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [core, backend, complete]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Clang 22 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ninja-build python3-venv libicu-dev liburing-dev
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
          sudo apt-get install -y libc++-22-dev libc++abi-22-dev
          wget -q https://github.com/Kitware/CMake/releases/download/v4.1.2/cmake-4.1.2-linux-x86_64.sh
          chmod +x cmake-4.1.2-linux-x86_64.sh
          sudo ./cmake-4.1.2-linux-x86_64.sh --skip-license --prefix=/usr/local

      - name: Check version contract
        run: python3 tools/release/check_version.py

      - name: Select feature profile
        id: profile
        shell: bash
        run: |
          case "${{ matrix.profile }}" in
            core)
              echo 'options=-DCNETMOD_ENABLE_ALL_PROTOCOLS=OFF -DCNETMOD_ENABLE_ORM=OFF -DCNETMOD_ENABLE_SSL=OFF' >> "$GITHUB_OUTPUT"
              ;;
            backend)
              echo 'options=-DCNETMOD_ENABLE_ALL_PROTOCOLS=OFF -DCNETMOD_ENABLE_HTTP=ON -DCNETMOD_ENABLE_MYSQL=ON -DCNETMOD_ENABLE_REDIS=ON -DCNETMOD_ENABLE_OPENAI=ON -DCNETMOD_ENABLE_ORM=ON' >> "$GITHUB_OUTPUT"
              ;;
            complete)
              echo 'options=-DCNETMOD_ENABLE_ALL_PROTOCOLS=ON -DCNETMOD_ENABLE_ORM=ON -DCNETMOD_ENABLE_BORINGSSL_QUIC=ON' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Prepare interoperability test environment
        shell: bash
        run: |
          python3 -m venv .venv-tests
          if [[ "${{ matrix.profile }}" != core ]]; then
            requirements=(--requirement testing/http2/requirements.txt)
            if [[ "${{ matrix.profile }}" == complete ]]; then
              requirements+=(
                --requirement testing/mail/requirements.txt
                --requirement testing/http3/requirements.txt
                --requirement testing/grpc/requirements.txt
                --requirement testing/mqtt/requirements.txt
              )
            fi
            .venv-tests/bin/python -m pip install \
              --disable-pip-version-check "${requirements[@]}"
          fi

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B "build-${{ matrix.profile }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv-tests/bin/python" \
            -DLIBCXX_MODULE_DIRS=/usr/lib/llvm-22/share/libc++/v1 \
            -DLIBCXX_INCLUDE_DIRS=/usr/lib/llvm-22/include/c++/v1 \
            -DCNETMOD_DEPENDENCY_MODE=system \
            -DCNETMOD_BUILD_TESTS=ON \
            -DCNETMOD_BUILD_BENCH=OFF \
            -DCNETMOD_BUILD_EXAMPLES=OFF \
            -DCNETMOD_BUILD_C_API=OFF \
            -DCNETMOD_BUILD_PYTHON_BINDINGS=OFF \
            ${{ steps.profile.outputs.options }}

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.profile }}" == core ]]; then
            cmake --build "build-${{ matrix.profile }}" --target cnetmod_core --parallel 2
          else
            cmake --build "build-${{ matrix.profile }}" --parallel 2
          fi

      - name: Test
        if: matrix.profile != 'core'
        shell: bash
        run: |
          # Develop covers deterministic in-process behavior. Real-service
          # interoperability and the allocator fault-injection suite remain
          # release gates in the full platform workflows.
          .venv-tests/bin/python testing/run_required_ctest.py \
            --test-dir "build-${{ matrix.profile }}" \
            --output-on-failure --timeout 180 -j2 \
            -E '^(test_http_disabled_overhead|test_application_mysql_live|test_application_mysql_sharding_live|test_orm_tenant_live|test_application_redis_live|test_application_redis_cluster_live|python_amqp091_interoperability|python_amqp10_interoperability|python_kafka_interoperability|python_postgresql_interoperability|python_mongodb_interoperability|python_mongodb_production_example_e2e)$'
