name: Windows MSVC Build

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  # Reuse vcpkg's compiled packages between workflow runs. The cache key is
  # derived by vcpkg from the manifest, triplet and compiler ABI.
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-msvc:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake 4.2.3
        run: |
          choco install cmake --version=4.2.3 -y --force
          cmake --version

      - name: Setup vcpkg binary cache
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false

      - name: Install manifest dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet x64-windows --disable-metrics

      - name: Setup MSBuild (VS 2026 / VS18)
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "18.0"
          msbuild-architecture: x86

      - name: Set up Python interoperability runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify observability dependency boundary
        shell: pwsh
        run: |
          python -m unittest discover -s tools -p test_observability_dependencies.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_observability_dependencies.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify integration test execution gates
        shell: pwsh
        run: |
          python -m unittest discover -s testing/database -p test_required_runner.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s testing/database -p test_mysql_live_configuration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s testing/messaging -p test_runner_gate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B "${{ github.workspace }}/build" `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCNETMOD_BUILD_EXAMPLES=ON `
            -S "${{ github.workspace }}"

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --target cnetmod_build_all --config ${{ matrix.build_type }} -- /m:1

      - name: Verify protocol-free module graph
        if: matrix.build_type == 'Release'
        shell: pwsh
        run: |
          cmake -B "${{ github.workspace }}/build-core-only" `
            -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCNETMOD_ENABLE_ALL_PROTOCOLS=OFF -DCNETMOD_ENABLE_ORM=OFF `
            -DCNETMOD_BUILD_TESTS=OFF -DCNETMOD_BUILD_EXAMPLES=OFF `
            -S "${{ github.workspace }}"
          cmake --build "${{ github.workspace }}/build-core-only" `
            --target cnetmod_core --config Release -- /m:1

      - name: Verify ORM instrumentation without HTTP or OTEL transport
        if: matrix.build_type == 'Release'
        shell: pwsh
        run: |
          cmake -B "${{ github.workspace }}/build-mysql-no-http" `
            -G "Visual Studio 18 2026" -A x64 `
            -DCNETMOD_ENABLE_ALL_PROTOCOLS=OFF `
            -DCNETMOD_ENABLE_MYSQL=ON -DCNETMOD_ENABLE_ORM=ON `
            -DCNETMOD_ENABLE_SSL=OFF -DCNETMOD_ENABLE_LEVELDB=OFF `
            -DCNETMOD_ENABLE_LZ4=OFF `
            -DCNETMOD_BUILD_TESTS=ON -DCNETMOD_BUILD_EXAMPLES=OFF `
            -S "${{ github.workspace }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "${{ github.workspace }}/build-mysql-no-http" `
            --target test_orm_json_result_map test_instrumentation test_mysql_pool --config Release -- /m:1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "${{ github.workspace }}/build-mysql-no-http" `
            -C Release -R '^(test_orm_json_result_map|test_instrumentation|test_mysql_pool)$' --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Reuse the cache to prove that the pool has no ORM dependency.
          cmake -B "${{ github.workspace }}/build-mysql-no-http" -DCNETMOD_ENABLE_ORM=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "${{ github.workspace }}/build-mysql-no-http" `
            --target test_mysql_pool --config Release -- /m:1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "${{ github.workspace }}/build-mysql-no-http" `
            -C Release -R '^test_mysql_pool$' --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # These are release gates, not best-effort smoke checks.  In particular
      # the Python cases exercise the public HTTP client against a real local
      # HTTP/3 listener, dynamic QPACK recovery, cancellation, migration and
      # aioquic/WebTransport interoperability.
      - name: Install required HTTP/3 and WebTransport interoperability peer
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --requirement testing/http3/requirements.txt

      - name: Run QUIC and HTTP/3 release gates
        shell: pwsh
        run: |
          # windows-latest exposes RIO.  Do not silently accept IOCP fallback
          # here: the UDP batch test must prove that the registered receive
          # ring actually completed packets before this workflow advertises
          # Windows HTTP/3 coverage.
          $env:CNETMOD_REQUIRE_RIO = "1"
          ctest --test-dir "${{ github.workspace }}/build" -C "${{ matrix.build_type }}" `
            --output-on-failure --timeout 180 `
            -R '^(test_concurrent_containers|test_udp_batch|test_quic_frame|test_quic_packet|test_quic_early_data|test_http3_qpack|test_http3_frame|h3_interop_release_gate|h3_interop_multi_worker_release_gate|http_client_http3_end_to_end|http_client_http3_dynamic_qpack_end_to_end|http3_connection_migration)$'

      - name: Run application lifecycle and OTEL gates
        shell: pwsh
        run: |
          $gates = @('test_application', 'test_application_integrations', 'test_otlp_exporter', 'test_instrumentation', 'test_metric_aggregation', 'test_http_observability', 'test_http_disabled_overhead', 'test_mysql_pool', 'test_ssl_shutdown')
          foreach ($gate in $gates) {
            ctest --test-dir "${{ github.workspace }}/build" -C "${{ matrix.build_type }}" `
              --output-on-failure --timeout 60 --no-tests=error -R "^${gate}$"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run smoke tests
        shell: pwsh
        run: |
          Write-Host "=== Running cnetmod_app ==="
          & "${{ github.workspace }}/build/${{ matrix.build_type }}/cnetmod_app.exe"
          
          Write-Host "=== Running channel_demo ==="
          & "${{ github.workspace }}/build/examples/concurrency/${{ matrix.build_type }}/example_channel_demo.exe"
          
          Write-Host "=== Running stdexec_bridge ==="
          & "${{ github.workspace }}/build/examples/concurrency/${{ matrix.build_type }}/example_stdexec_bridge.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cnetmod-windows-msvc-${{ matrix.build_type }}
          path: |
            ${{ github.workspace }}/build/${{ matrix.build_type }}/*.lib
            ${{ github.workspace }}/build/${{ matrix.build_type }}/*.exe
            ${{ github.workspace }}/build/examples/**/*.exe
          retention-days: 7

      - name: Display build summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host "Build Summary for Windows MSVC VS2026"
          Write-Host "========================================="
          Write-Host "Build Type: ${{ matrix.build_type }}"
          Write-Host "Generator: Visual Studio 18 2026"
          Write-Host "CMake Version: 4.2.3"
          Write-Host "Runner: windows-latest"
          Write-Host "=========================================" 
