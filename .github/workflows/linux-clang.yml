name: Linux Clang/LLVM Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  build-clang-linux:
    runs-on: ubuntu-22.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-root-password
          MYSQL_DATABASE: cnetmod_test
          MYSQL_USER: cnetmod_test
          MYSQL_PASSWORD: disposable-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    
    strategy:
      fail-fast: false
      matrix:
        clang_version: [22]
        build_type: [Release, Debug]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add Ubuntu mirrors
      run: |
        mirrors=/etc/apt/mirrors.txt
        printf 'http://azure.archive.ubuntu.com/ubuntu\tpriority:1\n' | \
          sudo tee $mirrors
        curl http://mirrors.ubuntu.com/mirrors.txt | sudo tee --append $mirrors
        sudo sed -i \
          "s~http://azure.archive.ubuntu.com/ubuntu/~mirror+file:$mirrors~" \
          /etc/apt/sources.list

    - name: Install base dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget ninja-build libicu-dev liburing-dev

    - name: Install Clang ${{ matrix.clang_version }}
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh ${{ matrix.clang_version }} all
        sudo apt-get install -y libc++-${{ matrix.clang_version }}-dev libc++abi-${{ matrix.clang_version }}-dev
        clang++-${{ matrix.clang_version }} --version
        ls -la /usr/lib/llvm-${{ matrix.clang_version }}/

    - name: Install CMake 4.0+
      run: |
        wget https://github.com/Kitware/CMake/releases/download/v4.1.2/cmake-4.1.2-linux-x86_64.sh
        chmod +x cmake-4.1.2-linux-x86_64.sh
        sudo ./cmake-4.1.2-linux-x86_64.sh --skip-license --prefix=/usr/local
        cmake --version

    - name: Install pinned libkqueue compatibility backend
      if: matrix.build_type == 'Release'
      run: |
        git clone https://github.com/mheily/libkqueue.git /tmp/libkqueue
        git -C /tmp/libkqueue checkout 46a3e130f88b0b0742575dcb01d77e336538024b
        cmake -S /tmp/libkqueue -B /tmp/libkqueue-build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DENABLE_STATIC=OFF -DENABLE_SHARED=ON
        cmake --build /tmp/libkqueue-build --parallel 2
        ctest --test-dir /tmp/libkqueue-build --output-on-failure
        sudo cmake --install /tmp/libkqueue-build
        sudo ldconfig

    - name: Check libc++ modules availability
      run: |
        if [ -d "/usr/lib/llvm-${{ matrix.clang_version }}/share/libc++/v1" ]; then
          echo "libc++ modules found at /usr/lib/llvm-${{ matrix.clang_version }}/share/libc++/v1"
          ls -la /usr/lib/llvm-${{ matrix.clang_version }}/share/libc++/v1/
        else
          echo "Warning: libc++ modules not found"
        fi

    - name: Set up Python interoperability runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          testing/mail/requirements.txt
          testing/http2/requirements.txt
          testing/http3/requirements.txt
          testing/grpc/requirements.txt
          testing/mqtt/requirements.txt
          testing/database/requirements.txt
          testing/messaging/requirements.txt

    - name: Enable compiler cache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: "v0.16.0"

    - name: Verify observability dependency boundary
      run: |
        python -m unittest discover -s tools -p test_observability_dependencies.py
        python tools/check_observability_dependencies.py

    - name: Verify integration test execution gates
      run: |
        python -m unittest discover -s testing/database -p test_required_runner.py
        python -m unittest discover -s testing/database -p test_mysql_live_configuration.py
        python -m unittest discover -s testing/messaging -p test_runner_gate.py

    - name: Configure CMake
      run: |
        cmake -B ${{ github.workspace }}/build \
          -G "Ninja" \
          -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang_version }} \
          -DCMAKE_C_COMPILER=clang-${{ matrix.clang_version }} \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DLIBCXX_MODULE_DIRS=/usr/lib/llvm-${{ matrix.clang_version }}/share/libc++/v1 \
          -DLIBCXX_INCLUDE_DIRS=/usr/lib/llvm-${{ matrix.clang_version }}/include/c++/v1 \
          -DCNETMOD_ENABLE_BORINGSSL_QUIC=ON \
          -DCNETMOD_USE_LIBKQUEUE=${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }} \
          -DCNETMOD_BUILD_EXAMPLES=${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }} \
          -DCNETMOD_BUILD_BENCH=${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }} \
          -S ${{ github.workspace }}
      env:
        CC: clang-${{ matrix.clang_version }}
        CXX: clang++-${{ matrix.clang_version }}

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --parallel 2

    - name: Install complete interoperability runtime
      run: |
        python -m pip install --disable-pip-version-check \
          --requirement testing/mail/requirements.txt \
          --requirement testing/http2/requirements.txt \
          --requirement testing/http3/requirements.txt \
          --requirement testing/grpc/requirements.txt \
          --requirement testing/mqtt/requirements.txt

    - name: Run complete non-external test suite without skips
      run: |
        python testing/run_required_ctest.py \
          --test-dir "${{ github.workspace }}/build" \
          --output-on-failure --timeout 180 \
          -E '^(test_application_mysql_live|test_application_mysql_sharding_live|test_application_redis_live|test_application_redis_cluster_live|python_amqp091_interoperability|python_amqp10_interoperability|python_kafka_interoperability|python_postgresql_interoperability|python_mongodb_interoperability|python_postgresql_production_example_e2e|python_mongodb_production_example_e2e)$'

    - name: Verify protocol-free module graph
      if: matrix.build_type == 'Release'
      run: |
        cmake -B ${{ github.workspace }}/build-core-only \
          -G Ninja \
          -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang_version }} \
          -DCMAKE_C_COMPILER=clang-${{ matrix.clang_version }} \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DCMAKE_BUILD_TYPE=Release \
          -DLIBCXX_MODULE_DIRS=/usr/lib/llvm-${{ matrix.clang_version }}/share/libc++/v1 \
          -DLIBCXX_INCLUDE_DIRS=/usr/lib/llvm-${{ matrix.clang_version }}/include/c++/v1 \
          -DCNETMOD_ENABLE_ALL_PROTOCOLS=OFF -DCNETMOD_ENABLE_ORM=OFF \
          -DCNETMOD_BUILD_TESTS=OFF -DCNETMOD_BUILD_EXAMPLES=OFF \
          -S ${{ github.workspace }}
        cmake --build ${{ github.workspace }}/build-core-only \
          --target cnetmod_core --parallel 2

    - name: Configure minimal PostgreSQL feature probe
      if: matrix.build_type == 'Release'
      run: |
        cmake -B ${{ github.workspace }}/build-postgresql-minimal \
          -G "Ninja" \
          -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang_version }} \
          -DCMAKE_C_COMPILER=clang-${{ matrix.clang_version }} \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DCMAKE_BUILD_TYPE=Release \
          -DLIBCXX_MODULE_DIRS=/usr/lib/llvm-${{ matrix.clang_version }}/share/libc++/v1 \
          -DLIBCXX_INCLUDE_DIRS=/usr/lib/llvm-${{ matrix.clang_version }}/include/c++/v1 \
          -DCNETMOD_ENABLE_ALL_PROTOCOLS=OFF \
          -DCNETMOD_ENABLE_HTTP=ON \
          -DCNETMOD_ENABLE_MYSQL=ON \
          -DCNETMOD_ENABLE_POSTGRESQL=ON \
          -DCNETMOD_ENABLE_ORM=ON \
          -DCNETMOD_ENABLE_SSL=OFF \
          -DCNETMOD_ENABLE_REDIS=OFF \
          -DCNETMOD_BUILD_EXAMPLES=OFF \
          -S ${{ github.workspace }}

    - name: Build and test minimal PostgreSQL feature probe
      if: matrix.build_type == 'Release'
      run: |
        cmake --build ${{ github.workspace }}/build-postgresql-minimal \
          --target postgresql_interoperability_driver test_task test_orm_json_result_map \
          --parallel 2
        ctest --test-dir ${{ github.workspace }}/build-postgresql-minimal \
          --output-on-failure \
          -R '^(test_task|test_orm_json_result_map)$'

    - name: Run QUIC and HTTP/3 release gates
      run: |
        ctest --test-dir "${{ github.workspace }}/build" \
          --output-on-failure --timeout 180 \
          -R '^(test_concurrent_containers|test_udp_batch|test_quic_frame|test_quic_packet|test_quic_early_data|test_http3_qpack|test_http3_frame|h3_interop_release_gate|http_client_http3_end_to_end|http_client_http3_dynamic_qpack_end_to_end|http3_connection_migration)$'

    - name: Run application lifecycle and OTEL gates
      run: |
        set -euo pipefail
        for gate in test_application test_application_integrations test_otlp_exporter test_instrumentation test_metric_aggregation test_http_observability test_http_disabled_overhead test_mysql_pool test_ssl_shutdown; do
          ctest --test-dir "${{ github.workspace }}/build" \
            --output-on-failure --timeout 60 --no-tests=error -R "^${gate}$"
        done

    # The database gate never silently skips in CI.
    - name: Run real MySQL application lifecycle
      env:
        CNETMOD_MYSQL_INTEGRATION: '1'
        CNETMOD_MYSQL_TEST_USER: cnetmod_test
        CNETMOD_MYSQL_TEST_PASSWORD: disposable-test-password
        CNETMOD_MYSQL_TEST_DATABASE: cnetmod_test
      run: |
        cmake --build "${{ github.workspace }}/build" --target test_application_mysql_live --parallel 2
        python testing/database/check_mysql_live_configuration.py "${{ github.workspace }}/build/testing/tests/test_application_mysql_live"
        ctest --test-dir "${{ github.workspace }}/build" --output-on-failure --no-tests=error --timeout 30 -R '^test_application_mysql_live$'

    - name: Run real MySQL sharding lifecycle
      if: matrix.build_type == 'Release'
      env:
        CNETMOD_MYSQL_ROOT_PASSWORD: disposable-root-password
      run: |
        cmake --build "${{ github.workspace }}/build" --target test_application_mysql_sharding_live --parallel 2
        bash testing/database/run_mysql_sharding_ci.sh \
          "${{ github.workspace }}/build/testing/tests/test_application_mysql_sharding_live"

    - name: Run isolated Redis application lifecycle
      env:
        CNETMOD_REDIS_INTEGRATION: '1'
      run: |
        set -euo pipefail
        container=$(docker run --detach --publish 127.0.0.1::6379 \
          --tmpfs /data:rw,noexec,nosuid,size=64m \
          redis:7.4 redis-server --save '' --appendonly no --protected-mode no)
        cleanup() {
          status=$?
          docker logs "$container" || true
          docker rm --force "$container" >/dev/null || true
          exit "$status"
        }
        trap cleanup EXIT
        ready=false
        for attempt in $(seq 1 30); do
          if docker exec "$container" redis-cli ping | grep -qx PONG; then
            ready=true
            break
          fi
          sleep 1
        done
        if [ "$ready" != true ]; then
          echo 'Isolated Redis did not become ready.' >&2
          exit 1
        fi
        export CNETMOD_REDIS_TEST_PORT=$(docker port "$container" 6379/tcp | sed -n 's/^127\.0\.0\.1://p')
        test -n "$CNETMOD_REDIS_TEST_PORT"
        cmake --build "${{ github.workspace }}/build" --target test_application_redis_live --parallel 2
        # Invoke the executable directly: an unexpected skip (77) fails this gate.
        timeout 30 "${{ github.workspace }}/build/testing/tests/test_application_redis_live"

    - name: Run isolated Redis Cluster lifecycle
      if: matrix.build_type == 'Release'
      run: |
        cmake --build "${{ github.workspace }}/build" --target test_application_redis_cluster_live --parallel 2
        bash testing/redis/run_cluster_ci.sh \
          "${{ github.workspace }}/build/testing/tests/test_application_redis_cluster_live"

    - name: Run real PostgreSQL and MongoDB interoperability
      if: matrix.build_type == 'Release'
      run: |
        set -euo pipefail
        python -m pip install --requirement testing/database/requirements.txt
        python -m unittest discover -s testing/database -p test_required_runner.py
        cmake --build "${{ github.workspace }}/build" \
          --target postgresql_interoperability_driver mongodb_interoperability_driver --parallel 2
        bash testing/database/run_linux_ci.sh "${{ github.workspace }}/build"

    - name: Install messaging interoperability libraries
      if: matrix.build_type == 'Release'
      run: python -m pip install --requirement testing/messaging/requirements.txt

    - name: Run real-broker messaging interoperability
      if: matrix.build_type == 'Release'
      env:
        CNETMOD_MESSAGING_SERVICE_MODE: container
        CNETMOD_MESSAGING_REQUIRED: '1'
      run: |
        set -euo pipefail
        python testing/messaging/test_runner_gate.py
        for protocol in amqp091 amqp10 kafka; do
          ctest --test-dir "${{ github.workspace }}/build" \
            --output-on-failure --no-tests=error \
            --timeout 900 \
            -R "^python_${protocol}_interoperability$"
        done

    - name: Run smoke tests
      if: matrix.build_type == 'Release'
      run: |
        echo "=== Running cnetmod_app ==="
        ${{ github.workspace }}/build/cnetmod_app || true
        
        echo "=== Running timer_demo ==="
        timeout 5 ${{ github.workspace }}/build/examples/core/example_timer_demo || true
        
        echo "=== Running channel_demo ==="
        ${{ github.workspace }}/build/examples/concurrency/example_channel_demo || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: cnetmod-linux-clang${{ matrix.clang_version }}-${{ matrix.build_type }}
        path: |
          ${{ github.workspace }}/build/*.a
          ${{ github.workspace }}/build/cnetmod_app
          ${{ github.workspace }}/build/examples/**
        retention-days: 7

    - name: Display build summary
      if: always()
      run: |
        echo "========================================="
        echo "Build Summary for Clang ${{ matrix.clang_version }}"
        echo "========================================="
        echo "Build Type: ${{ matrix.build_type }}"
        echo "Compiler: /usr/bin/clang++-${{ matrix.clang_version }}"
        /usr/bin/clang++-${{ matrix.clang_version }} --version 2>&1 || echo "clang++ not found"
        echo "=========================================" 
