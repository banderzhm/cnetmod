name: macOS Clang/LLVM Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  build-clang-macos:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]  # Apple Silicon (M1/M2)
        build_type: [Release, Debug]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Homebrew and install LLVM
      run: |
        brew install icu4c llvm@21 ninja cmake

        LLVM_PREFIX="$(brew --prefix llvm@21)"
        LLVM_VERSION="$("${LLVM_PREFIX}/bin/clang++" --version)"
        echo "Installed LLVM version:"
        echo "$LLVM_VERSION"

    - name: Detect Homebrew LLVM paths
      id: llvm-paths
      run: |
        LLVM_PREFIX="$(brew --prefix llvm@21)"
        
        echo "LLVM_PREFIX=${LLVM_PREFIX}" >> $GITHUB_OUTPUT
        echo "Detected LLVM prefix: ${LLVM_PREFIX}"
        
        ls -la "${LLVM_PREFIX}/" || true
        ls -la "${LLVM_PREFIX}/share/" || true
        ls -la "${LLVM_PREFIX}/share/libc++/" 2>/dev/null || echo "No share/libc++/ directory"
        
        LIBCXX_MODULES=""
        for path in \
          "${LLVM_PREFIX}/share/libc++/v1" \
          "${LLVM_PREFIX}/lib/c++/v1" \
          "${LLVM_PREFIX}/share/libc++" \
          ; do
          if [ -f "${path}/std.cppm" ]; then
            LIBCXX_MODULES="${path}"
            break
          fi
        done
        
        if [ -z "${LIBCXX_MODULES}" ]; then
          LIBCXX_MODULES=$(find ${LLVM_PREFIX} -name "std.cppm" -exec dirname {} \; 2>/dev/null | head -1)
        fi
        
        echo "LIBCXX_MODULES=${LIBCXX_MODULES}" >> $GITHUB_OUTPUT
        echo "libc++ modules path: ${LIBCXX_MODULES}"
        
        LIBCXX_INCLUDE="${LLVM_PREFIX}/include/c++/v1"
        echo "LIBCXX_INCLUDE=${LIBCXX_INCLUDE}" >> $GITHUB_OUTPUT
        echo "libc++ include path: ${LIBCXX_INCLUDE}"
        
        echo "=== Path Validation ==="
        if [ -n "${LIBCXX_MODULES}" ] && [ -d "${LIBCXX_MODULES}" ]; then
          echo "libc++ modules found:"
          ls -la "${LIBCXX_MODULES}/"
        else
          echo "WARNING: libc++ modules NOT found at expected location"
          find ${LLVM_PREFIX} -name "*.cppm" 2>/dev/null || echo "No .cppm files found"
        fi
        
        if [ -d "${LIBCXX_INCLUDE}" ]; then
          echo "libc++ headers found at: ${LIBCXX_INCLUDE}"
        else
          echo "WARNING: libc++ headers NOT found at: ${LIBCXX_INCLUDE}"
        fi

    - name: Get macOS SDK path
      id: sdk-path
      run: |
        SDKROOT=$(xcrun --show-sdk-path)
        echo "SDKROOT=${SDKROOT}" >> $GITHUB_OUTPUT
        echo "macOS SDK path: ${SDKROOT}"

    - name: Set up Python interoperability runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          testing/mail/requirements.txt
          testing/http2/requirements.txt
          testing/http3/requirements.txt
          testing/grpc/requirements.txt
          testing/mqtt/requirements.txt

    - name: Enable compiler cache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: "v0.16.0"

    - name: Verify observability dependency boundary
      run: |
        python -m unittest discover -s tools -p test_observability_dependencies.py
        python tools/check_observability_dependencies.py

    - name: Verify integration test execution gates
      run: |
        python -m unittest discover -s testing/database -p test_required_runner.py
        python -m unittest discover -s testing/database -p test_mysql_live_configuration.py
        python -m unittest discover -s testing/messaging -p test_runner_gate.py

    - name: Configure CMake
      run: |
        LLVM_PREFIX="${{ steps.llvm-paths.outputs.LLVM_PREFIX }}"
        ICU_PREFIX="$(brew --prefix icu4c)"
        SDKROOT="${{ steps.sdk-path.outputs.SDKROOT }}"
        LIBCXX_MODULES="${{ steps.llvm-paths.outputs.LIBCXX_MODULES }}"
        LIBCXX_INCLUDE="${{ steps.llvm-paths.outputs.LIBCXX_INCLUDE }}"
        
        cmake -B ${{ github.workspace }}/build \
          -G "Ninja" \
          -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++" \
          -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang" \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_FLAGS="-isysroot ${SDKROOT} -stdlib=libc++" \
          -DCMAKE_OSX_SYSROOT="${SDKROOT}" \
          -DCMAKE_PREFIX_PATH="${ICU_PREFIX}" \
          -DLIBCXX_MODULE_DIRS="${LIBCXX_MODULES}" \
          -DLIBCXX_INCLUDE_DIRS="${LIBCXX_INCLUDE}" \
          -DCNETMOD_ENABLE_BORINGSSL_QUIC=ON \
          -DCNETMOD_BUILD_EXAMPLES=${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }} \
          -DCNETMOD_BUILD_BENCH=${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }} \
          -S ${{ github.workspace }}
      env:
        CC: ${{ steps.llvm-paths.outputs.LLVM_PREFIX }}/bin/clang
        CXX: ${{ steps.llvm-paths.outputs.LLVM_PREFIX }}/bin/clang++

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --parallel $(sysctl -n hw.ncpu)

    - name: Install complete interoperability runtime
      run: |
        python -m pip install --disable-pip-version-check \
          --requirement testing/mail/requirements.txt \
          --requirement testing/http2/requirements.txt \
          --requirement testing/http3/requirements.txt \
          --requirement testing/grpc/requirements.txt \
          --requirement testing/mqtt/requirements.txt

    - name: Run complete non-external test suite without skips
      run: |
        python testing/run_required_ctest.py \
          --test-dir "${{ github.workspace }}/build" \
          --output-on-failure --timeout 180 \
          -E '^(test_application_mysql_live|test_application_redis_live|python_amqp091_interoperability|python_amqp10_interoperability|python_kafka_interoperability|python_postgresql_interoperability|python_mongodb_interoperability|python_postgresql_production_example_e2e|python_mongodb_production_example_e2e)$'

    - name: Verify protocol-free module graph
      if: matrix.build_type == 'Release'
      run: |
        LLVM_PREFIX="${{ steps.llvm-paths.outputs.LLVM_PREFIX }}"
        cmake -B ${{ github.workspace }}/build-core-only \
          -G Ninja \
          -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++" \
          -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang" \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_FLAGS="-isysroot ${{ steps.sdk-path.outputs.SDKROOT }} -stdlib=libc++" \
          -DCMAKE_OSX_SYSROOT="${{ steps.sdk-path.outputs.SDKROOT }}" \
          -DLIBCXX_MODULE_DIRS="${{ steps.llvm-paths.outputs.LIBCXX_MODULES }}" \
          -DLIBCXX_INCLUDE_DIRS="${{ steps.llvm-paths.outputs.LIBCXX_INCLUDE }}" \
          -DCNETMOD_ENABLE_ALL_PROTOCOLS=OFF -DCNETMOD_ENABLE_ORM=OFF \
          -DCNETMOD_BUILD_TESTS=OFF -DCNETMOD_BUILD_EXAMPLES=OFF \
          -S ${{ github.workspace }}
        cmake --build ${{ github.workspace }}/build-core-only \
          --target cnetmod_core --parallel $(sysctl -n hw.ncpu)

    - name: Run QUIC and HTTP/3 release gates
      run: |
        ctest --test-dir "${{ github.workspace }}/build" \
          --output-on-failure --timeout 180 \
          -R '^(test_concurrent_containers|test_udp_batch|test_quic_frame|test_quic_packet|test_quic_early_data|test_http3_qpack|test_http3_frame|h3_interop_release_gate|http_client_http3_end_to_end|http_client_http3_dynamic_qpack_end_to_end|http3_connection_migration)$'

    - name: Run application lifecycle and OTEL gates
      run: |
        set -euo pipefail
        for gate in test_application test_application_integrations test_otlp_exporter test_instrumentation test_metric_aggregation test_http_observability test_http_disabled_overhead test_mysql_pool test_ssl_shutdown; do
          ctest --test-dir "${{ github.workspace }}/build" \
            --output-on-failure --timeout 60 --no-tests=error -R "^${gate}$"
        done

    - name: Verify build artifacts
      run: |
        echo "Build artifacts:"
        ls -la ${{ github.workspace }}/build/
        
        if [ -f "${{ github.workspace }}/build/cnetmod_app" ]; then
          echo "Main executable found:"
          file ${{ github.workspace }}/build/cnetmod_app
          
          echo "Dynamic library dependencies:"
          otool -L ${{ github.workspace }}/build/cnetmod_app || true
        fi

    - name: Run smoke tests
      if: matrix.build_type == 'Release'
      run: |
        echo "=== Running cnetmod_app ==="
        ${{ github.workspace }}/build/cnetmod_app || true
        
        echo "=== Running timer_demo ==="
        timeout 5 ${{ github.workspace }}/build/examples/core/example_timer_demo || true
        
        echo "=== Running channel_demo ==="
        ${{ github.workspace }}/build/examples/concurrency/example_channel_demo || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: cnetmod-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          ${{ github.workspace }}/build/*.a
          ${{ github.workspace }}/build/cnetmod_app
          ${{ github.workspace }}/build/examples/**
        retention-days: 7

    - name: Display build summary
      if: always()
      run: |
        LLVM_PREFIX="${{ steps.llvm-paths.outputs.LLVM_PREFIX }}"
        echo "========================================="
        echo "Build Summary for macOS"
        echo "========================================="
        echo "OS: ${{ matrix.os }}"
        echo "Build Type: ${{ matrix.build_type }}"
        echo "Architecture: $(uname -m)"
        echo "Compiler: ${LLVM_PREFIX}/bin/clang++"
        "${LLVM_PREFIX}/bin/clang++" --version 2>&1 || echo "clang++ not found"
        echo "macOS SDK: ${{ steps.sdk-path.outputs.SDKROOT }}"
        echo "========================================="
