# Application accepts .json, .yaml, and .yml through the same validated model.
application:
  name: cnetmod-service
  install_signal_handlers: true

crash_dump:
  directory: crash

logging:
  manage_lifecycle: true
  level: info
  format: json

http:
  address: 0.0.0.0
  port: 8080
  request_timeout_ms: 30000

management:
  enabled: true
  address: 127.0.0.1
  port: 8081

observability:
  tracing: true
  metrics: true
  logs: true
  sampling_ratio: 1.0
  otlp:
    traces_endpoint: http://127.0.0.1:4318/v1/traces
    metrics_endpoint: http://127.0.0.1:4318/v1/metrics
    logs_endpoint: http://127.0.0.1:4318/v1/logs
    service_name: cnetmod-service

orm:
  sharding:
    enabled: false
    topologies:
      orders:
        logical_table: orders
        table_count: 64
        databases: [orders-0, orders-1]
        scatter_gather: true
        distributed_transactions: true

services:
  orders-database-0:
    type: mysql
    instance: orders-0
    enabled: false
    required: true
    host: 127.0.0.1
    port: 3306
    username: application
    password: ""
    database: orders_0
    ssl: enable
    tls_verify: false
    connect_timeout_ms: 20000
    pool_timeout_ms: 5000
    retry_interval_ms: 30000
    ping_interval_ms: 3600000
    ping_timeout_ms: 10000
  orders-database-1:
    type: mysql
    instance: orders-1
    enabled: false
    required: true
    host: 127.0.0.1
    port: 3306
    username: application
    password: ""
    database: orders_1
  primary-cache:
    type: redis
    instance: primary
    enabled: false
    required: true
    host: 127.0.0.1
    port: 6379
    password: ""
